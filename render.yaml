services:
  - type: web
    name: zwm-bcn1
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        value: BCN1admin2026
      - key: DB_PATH
        value: /opt/render/project/src/zwm.db
